{# Estilos comunes del resumen corto y el ampliado (membrete MOVA en papel blanco). #}
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei UI","Segoe UI",Arial,sans-serif;background:#eef2f7;color:#1a1a1a}
.page{max-width:820px;margin:30px auto;background:#fff;position:relative;padding:44px 60px 34px;box-shadow:0 6px 24px rgba(0,0,0,.12);min-height:1040px}
.wm{position:absolute;top:200px;left:50%;transform:translateX(-50%);width:440px;opacity:.9;z-index:0;pointer-events:none}
.doc{position:relative;z-index:1}
.head{display:flex;justify-content:flex-end;align-items:flex-start;margin-bottom:42px}
.head .logo{width:150px;height:auto}
h2{font-size:10.5pt;font-weight:700;text-decoration:underline;color:#111;margin:34px 0 9px}
h2:first-of-type{margin-top:0}
p{font-size:9pt;line-height:1.7;color:#222;margin:6px 0}
.nd{color:#888;font-style:italic}
ul{list-style:none;margin:8px 0 8px 4px}
li{font-size:9pt;line-height:1.7;color:#222;padding-left:20px;position:relative;margin:4px 0}
li.dot::before{content:"•";position:absolute;left:4px;top:0;color:#222}
li.chk::before{content:"✓";position:absolute;left:2px;top:0;color:#222}
li strong{color:#111}
.pie{display:flex;gap:70px;border-top:1px solid #bbb;margin-top:70px;padding-top:10px;font-size:9px;color:#777;line-height:1.7}
a{color:#1a1a1a}
@media print{body{background:#fff}.page{box-shadow:none;margin:0;padding:34px 46px;max-width:100%;min-height:auto}}
@media (max-width:700px){.page{padding:28px 18px}.wm{width:80%}}
</style>
