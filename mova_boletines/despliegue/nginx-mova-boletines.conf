# Nginx como pasarela inversa para MOVA Boletines Oficiales (boletines.movaia.es).
#
# Lo importante: proxy_read_timeout a 600 s. Una ejecucion manual desde la
# interfaz puede tardar varios minutos (ocho boletines + llamadas al modelo),
# y con el tiempo de espera por defecto (60 s) Nginx cortaria la peticion.
#
# Instalacion (la hace despliegue/instalar_vps.sh):
#   cp despliegue/nginx-mova-boletines.conf /etc/nginx/sites-available/mova-boletines
#   ln -s /etc/nginx/sites-available/mova-boletines /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Certificado: Let's Encrypt por webroot (/var/www/letsencrypt). Se renueva solo
# con el temporizador de certbot, que recarga Nginx al terminar.

# Segunda red para los enlaces sin sesion; la aplicacion ya limita por IP.
limit_req_zone $binary_remote_addr zone=mova_enlaces:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=mova_login:10m rate=10r/m;

upstream mova_boletines {
    # UN SOLO destino: la aplicacion mantiene estado en memoria y no se replica.
    server 127.0.0.1:8770;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name boletines.movaia.es;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name boletines.movaia.es;

    ssl_certificate     /etc/letsencrypt/live/boletines.movaia.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boletines.movaia.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:mova_ssl:5m;

    access_log /var/log/nginx/mova-boletines.access.log;
    error_log  /var/log/nginx/mova-boletines.error.log;

    client_max_body_size 16m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    location / {
        proxy_pass http://mova_boletines;
        # Procesos largos: ejecucion manual del pipeline.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
        proxy_buffering off;
    }

    # Inicio de sesion: freno ante quien prueba contrasenas (ademas del de la aplicacion).
    location = /login {
        limit_req zone=mova_login burst=5 nodelay;
        proxy_pass http://mova_boletines;
    }

    # Botones del correo (documentos y descartes): llegan sin sesion, por diseno.
    location /d/ {
        limit_req zone=mova_enlaces burst=30 nodelay;
        proxy_pass http://mova_boletines;
        proxy_read_timeout 120s;
    }
    location /descartar/ {
        limit_req zone=mova_enlaces burst=10 nodelay;
        proxy_pass http://mova_boletines;
        proxy_read_timeout 60s;
    }

    location /estaticos/ {
        proxy_pass http://mova_boletines;
        expires 1h;
    }
}
