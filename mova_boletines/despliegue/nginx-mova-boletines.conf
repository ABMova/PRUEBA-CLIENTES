# Nginx como pasarela inversa para MOVA Boletines Oficiales.
#
# Lo importante: proxy_read_timeout a 600 s. Una ejecucion manual desde la
# interfaz puede tardar varios minutos (siete boletines + llamadas al modelo),
# y con el tiempo de espera por defecto (60 s) Nginx cortaria la peticion.
#
#   sudo cp despliegue/nginx-mova-boletines.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/nginx-mova-boletines.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream mova_boletines {
    # UN SOLO destino: la aplicacion mantiene estado en memoria y no se replica.
    server 127.0.0.1:8770;
    keepalive 8;
}

server {
    listen 80;
    server_name boletines.miempresa.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name boletines.miempresa.local;

    ssl_certificate     /etc/ssl/certs/boletines.miempresa.local.crt;
    ssl_certificate_key /etc/ssl/private/boletines.miempresa.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/mova-boletines.access.log;
    error_log  /var/log/nginx/mova-boletines.error.log;

    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://mova_boletines;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Procesos largos: ejecucion manual del pipeline.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;

        proxy_buffering off;
    }

    # Los enlaces "Descartar" del correo llegan aqui sin sesion, por diseno.
    # La aplicacion ya limita los intentos por IP; esto es una segunda red.
    location /descartar/ {
        limit_req zone=descartes burst=10 nodelay;
        proxy_pass http://mova_boletines;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /estaticos/ {
        proxy_pass http://mova_boletines;
        proxy_cache_valid 200 1h;
        expires 1h;
    }
}

# Declarar en el bloque http de nginx.conf:
# limit_req_zone $binary_remote_addr zone=descartes:10m rate=30r/m;
