{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block ancho %}{% endblock %}
{% block contenido %}
<section class="card centro">
  <h2>Acceso</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">Correo</label>
    <input id="email" name="email" type="text" autocomplete="username" autofocus required>
    <label for="clave">Contraseña</label>
    <input id="clave" name="clave" type="password" autocomplete="current-password" required>
    <div class="row" style="margin-top:1rem"><button class="btn btn-primary" type="submit">Entrar</button></div>
  </form>
  <p class="hint" style="margin-top:1rem">La sesión caduca a las 8 horas. Cada acceso queda registrado.</p>
</section>
{% endblock %}
